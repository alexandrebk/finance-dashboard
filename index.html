<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finance Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f9cf9'/%3E%3Ctext x='16' y='23' font-size='22' font-family='system-ui,sans-serif' font-weight='700' text-anchor='middle' fill='%23fff'%3E%E2%82%AC%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <h1>💰 Finance — Taux</h1>
    <span id="last-update" class="last-update"></span>
  </header>

  <main>
    <section>
      <h2>Taux souverains — valeurs actuelles</h2>
      <div class="chart-box">
        <canvas id="chart-sovereign-curve"></canvas>
      </div>
    </section>

    <section>
      <h2>Taux directeurs — historique</h2>
      <p class="hint">BCE, Fed, BoE, BNS, BoJ.</p>
      <div class="chart-box">
        <canvas id="chart-policy-history"></canvas>
      </div>
    </section>

    <section>
      <h2>Taux souverain — historique</h2>
      <div class="controls">
        <label>Pays
          <select id="select-country"></select>
        </label>
        <label>Maturité
          <select id="select-maturity"></select>
        </label>
      </div>
      <div class="chart-box">
        <canvas id="chart-sovereign-history"></canvas>
      </div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
